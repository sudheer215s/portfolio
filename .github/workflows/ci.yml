# Checks every push to main. Deploying is not done here.
name: CI

on:
  push:
    branches: [main]

# A newer push to main cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Vercel project's Node.js version
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Also type-checks the project.
      - run: npm run build
